version: "3.8"

services:
  # --- Spring Boot Backend ---
  backend:
    build: ./backend
    container_name: marketmind-backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/marketmind
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_ML_SERVICE_URL=http://ml-service:5001
      - APP_CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://frontend,http://20.251.162.144,https://marketmind.cfd,https://www.marketmind.cfd
    depends_on:
      ml-service:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped

  # --- PostgreSQL Database ---
  postgres:
    image: postgres:15-alpine
    container_name: marketmind-db
    environment:
      POSTGRES_DB: marketmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Python ML Service ---
  ml-service:
    build: ./ml-service
    container_name: marketmind-ml
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # --- React Frontend (Nginx) ---
  frontend:
    build: ./frontend
    container_name: marketmind-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

  # --- Certbot for Let's Encrypt ---
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  db-data:
