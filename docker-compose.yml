version: "3.8"

services:
  # --- Spring Boot Backend ---
  backend:
    build: ./backend
    container_name: marketmind-backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/authdb;AUTO_SERVER=TRUE
      - APP_ML_SERVICE_URL=http://ml-service:5001
      - APP_CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://frontend
    volumes:
      - db-data:/data
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  # --- Python ML Service ---
  ml-service:
    build: ./ml-service
    container_name: marketmind-ml
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # --- React Frontend (Nginx) ---
  frontend:
    build: ./frontend
    container_name: marketmind-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

volumes:
  db-data:
