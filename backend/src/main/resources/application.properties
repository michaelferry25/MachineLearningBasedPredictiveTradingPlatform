spring.application.name=trading-api
server.port=8080

# API Keys
finnhub.api.key=${FINNHUB_API_KEY}
news.api.key=${NEWS_API_KEY}

# Database
spring.datasource.url=jdbc:h2:file:../data/authdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=60
security.jwt.issuer=marketmind
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ML prediction tracking
app.ml.service-url=http://localhost:5001
app.ml.symbols=AAPL,MSFT,TSLA,AMZN,NVDA,META,NFLX,GOOGL
app.ml.horizon-hours=24
app.ml.schedule-ms=3600000
app.ml.evaluate-ms=3600000

# Logging
logging.level.root=INFO
