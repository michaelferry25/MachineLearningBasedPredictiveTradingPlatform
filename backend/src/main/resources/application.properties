spring.application.name=trading-api
server.port=8080

# API Keys
finnhub.api.key=${FINNHUB_API_KEY}
news.api.key=${NEWS_API_KEY}

# Database - defaults to H2 for local dev, overridden by env vars in Docker for PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:../data/authdb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=60
security.jwt.issuer=marketmind
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://marketmind.cfd,http://localhost}

# ML prediction tracking
app.ml.service-url=${APP_ML_SERVICE_URL:http://localhost:5001}
app.ml.symbols=AAPL,MSFT,TSLA,AMZN,NVDA,META,NFLX,GOOGL
app.ml.horizon-hours=24
app.ml.schedule-ms=3600000
app.ml.evaluate-ms=3600000
app.ml.daily-close-cron=0 0 16 * * MON-FRI

# Logging
logging.level.root=INFO
