services:
  backend:
    build: ./backend
    container_name: marketmind-backend-local
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/marketmind
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_ML_SERVICE_URL=http://ml-service:5001
      - APP_CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://frontend
    depends_on:
      ml-service:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: marketmind-db-local
    environment:
      POSTGRES_DB: marketmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # Mapped to 5433 on Mac to avoid conflicts with local postgres
    volumes:
      - db-data-local:/var/lib/postgresql/data
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    container_name: marketmind-ml-local
    ports:
      - "5002:5001" # Mapped to 5002 locally to avoid conflicts
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: marketmind-frontend-local
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

volumes:
  db-data-local:
